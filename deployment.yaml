apiVersion: apps/v1
kind: Deployment
metadata:
  name: movies-deployment
  labels:
    app: movies
spec:
  replicas: 3
  selector:
    matchLabels:
      app: movies
  template:
    metadata:
      labels:
        app: movies
    spec:
      containers:
        - name: movies
          image: drewroswashu/lab4:latest
          ports:
            - containerPort: 8000
          env:
            - name: AWS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: movies-secret
                  key: aws_access_key
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: movies-secret
                  key: aws_secret_access_key
            - name: BUCKET
              valueFrom:
                configMapKeyRef:
                  name: movies-configmap
                  key: bucket